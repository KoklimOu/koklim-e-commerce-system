# Change user service running port
server:
  port: 8554
  forward-headers-strategy: framework

spring:
  application:
    name: user-service
  profiles:
    active: dev
  config:
    import:
      # optional: the service still starts if there is no user-service.yaml in Nacos yet
      - optional:nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension}
  cloud:
    nacos:
      config:
        file-extension: yaml
        namespace: ${spring.profiles.active}
      discovery:
        namespace: ${spring.profiles.active}
      username: nacos
      password: nacos
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:ecommerce_user}
    password: ${DB_PASSWORD:mypassword}
    url: ${DB_URL:jdbc:postgresql://localhost:8432/db_user}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Keycloak admin client: a service-account client (create it with docs/setup-keycloak-admin-client.sh)
keycloak:
  admin:
    server-url: ${KEYCLOAK_URL:http://localhost:8180}
    realm: ecommerce
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:ecommerce-admin-client}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}   # never commit the real secret
