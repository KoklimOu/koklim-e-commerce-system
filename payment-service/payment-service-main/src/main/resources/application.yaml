# Change payment service running port
server:
  port: 8552

spring:
  application:
    name: payment-service
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ecommerce_user
    password: mypassword
    url: jdbc:postgresql://localhost:8432/db_payment
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
