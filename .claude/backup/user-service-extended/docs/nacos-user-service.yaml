# Optional. In the Nacos console create:
#   Namespace: dev   |   Data ID: user-service.yaml   |   Group: DEFAULT_GROUP   |   Format: YAML
# Values here override application.yaml, so you can change them without rebuilding the service.
# Keep the Keycloak admin client secret OUT of Nacos config unless the namespace is access-controlled;
# prefer the KEYCLOAK_ADMIN_CLIENT_SECRET environment variable.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/ecommerce
keycloak:
  admin:
    server-url: http://localhost:8180
    realm: ecommerce
    client-id: user-service-admin
