server:
  port: 8585

spring:
  application:
    name: gateway-service
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension}
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ecommerce-gateway
            client-secret: 9PHEfTshKhvgqpGxViflc81kq1hw9XfKBsM3Ro4YDIxjjtp09y6cvFrGPpYZRJsky385bNW5z6xbvFVTdB55aN
            authorization-grant-type: authorization_code
            scope: openid,profile,email
            # The browser only talks to the Vue dev server (5173), which proxies to the gateway.
            redirect-uri: http://localhost:5173/login/oauth2/code/keycloak
        provider:
          keycloak:
            issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8180/realms/ecommerce}
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8180/realms/ecommerce}
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true
          routes:
            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/v1/customers/**
              filters:
                - TokenRelay=
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**
              filters:
                - TokenRelay=
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**,/api/v1/config/**
              filters:
                - TokenRelay=
            # API docs of each service, for the Swagger UI: /user-service/v3/api-docs -> user-service /v3/api-docs
            - id: user-service-api-docs
              uri: lb://user-service
              predicates:
                - Path=/user-service/v3/api-docs
              filters:
                - RewritePath=/user-service/(?<path>.*), /$\{path}
    nacos:
      config:
        file-extension: yaml
        namespace: ${spring.profiles.active}
      discovery:
        namespace: ${spring.profiles.active}
      username: nacos
      password: nacos
      server-addr: 127.0.0.1:8848

# Swagger UI: http://localhost:8585/swagger-ui.html (pick the service in the top-right dropdown)
# To add a service: add an "<name>-api-docs" route above and a line here.
springdoc:
  swagger-ui:
    urls:
      - name: user-service
        url: /user-service/v3/api-docs
