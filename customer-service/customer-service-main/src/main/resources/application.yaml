#change customer service running port

server:
  port: 0

spring:
  application:
    name: customer-service
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ecommerce_user
    password: mypassword
    url: jdbc:postgresql://localhost:8432/db_customer
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

